# Local guardrails enforcing CLAUDE.md §5 (no secrets / no raw data in the repo).
# Install once:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      # vendor/ is third-party code shipped verbatim (vendor/README.md) - auto-fixing its
      # whitespace would modify it, breaking the clean-diff-against-upstream rule.
      - id: end-of-file-fixer
        exclude: ^vendor/
      - id: trailing-whitespace
        exclude: ^vendor/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Hard reject on blocked terms (employer, colleague names, internal hosts).
      # Terms live hashed in .dlp-blocklist; the plaintext master list is
      # .dlp-keywords.local (gitignored). No list configured = no-op, so a fresh
      # clone stays committable. See scripts/dlp_guard.py for the why.
      - id: dlp-blocked-terms
        name: block DLP keywords (employer / personal names / internal hosts)
        entry: python3 scripts/dlp_guard.py
        language: system
        # Text-ish files only; the guard skips binaries by suffix anyway.
        exclude: '^(vendor/|\.dlp-blocklist$)'

      - id: block-raw-data
        name: block raw market/comms data files (use synthetic data - CLAUDE.md §5)
        entry: "Raw data files must not be committed. Generate synthetic data with scripts/gen_synthetic.py."
        language: fail
        # Match CI's no-raw-data gate: include the pipeline's own .jsonl and the converter's .xlsx/.xls/.tsv.
        files: '\.(csv|tsv|parquet|pcap|jsonl|xlsx|xls)$'

      # Definition-of-Done gate: tests must pass before a commit lands (automatic, not
      # prompt-dependent). Runs on changes to rules/, tests/ or scripts/.
      - id: pytest
        name: run tests (Definition of Done)
        # python3 first: this host has no bare `python`, so the gate could never run and
        # blocked every commit touching rules/, tests/ or scripts/ with "Executable
        # `python` not found". Windows usually has `python` and no `python3`, hence the
        # fallback - hardcoding either name breaks half the machines this plugin targets.
        entry: sh -c 'command -v python3 >/dev/null 2>&1 && exec python3 -m pytest -q || exec python -m pytest -q'
        language: system
        pass_filenames: false
        files: '^(rules|tests|scripts)/.*\.py$'
