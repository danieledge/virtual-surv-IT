name: Install smoke (fresh container)

# Step 7.10 / 5.6 (framework review 2026-09-13): once a week, and on demand, a machine that
# has never seen the plugin runs the real `claude plugin marketplace add` and `claude plugin
# install`, enables the plugin in a throwaway client project, and proves the guards fire
# there with scripts/armed_check.py. No model call is made.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: Fresh install, then armed check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned, 2026-08-19 audit)
      - name: Build the fresh image
        run: docker build -f ci/docker/Dockerfile.fresh -t vsit-fresh .
      - name: Install the plugin as a user would and prove the guards
        env:
          VS_BRANCH: ${{ github.ref_name }}
        run: docker run --rm -e VS_BRANCH vsit-fresh
