case: process-light-engagement
# Per-case wall clock (harness config, not a scoring criterion).
# a full lifecycle at low ceremony; observed to 2981s.
timeout_s: 4200
workflow: /engage-light
rubric: process-discipline-light
input: scenario.md
description: >
  Profile case - the user EXPLICITLY chose the light engagement. A correct run explains the
  profile in the banner (what light drops, what never changes, when to upgrade), records
  profile light in the machine-readable state, keeps the safety gates and the code chain
  (tests + review + independent QA for the delivered script), stays at 2-3 agents, and
  closes with a close note - NO delivery report, NO summary email, no BRD/FSD chain.

planted:
  - id: LIGHT-1
    # The banner explains the profile: what is dropped, what is unchanged, when it upgrades.
    keywords: [light engagement, light profile, minimal ceremony, "upgrades to a standard"]
    min_severity: warning
    must_find: true
  - id: LIGHT-2
    # Profile recorded in the state file.
    keywords: [profile light, "--profile light", "| light |"]
    min_severity: warning
    must_find: true
  - id: LIGHT-3
    # Safety gates still run in full (numeral/word/phrasing variants - the normalizer
    # phrases freely: "static-only review by default", "safety warning", "consent marker"
    # all observed live).
    keywords: [execution consent, explicit consent, consent marker, data attestation,
               disclaimer, safety warning, data safety, static by default, static-only]
    min_severity: warning
    must_find: true
  - id: LIGHT-4
    # Code chain still applies to the delivered script.
    keywords: [tests, code review, independent QA, qa verification]
    min_severity: warning
    must_find: true
  - id: LIGHT-5
    # Lean team stated out loud (numeral and word forms both - the normalizer phrases
    # freely: "Team sizing: 2 agents" observed live).
    keywords: [right-siz, team siz, "2 agents", "3 agents", two agents, three agents,
               one builder, specialist agents]
    min_severity: warning
    must_find: true

  - id: LIGHT-6
    # The summary email survives the light profile (user ruling 2026-07-27) - short, signed
    # as Morgan, .txt. The probe emits its own finding when the email exists on disk.
    keywords: [engagement-summary, summary email, signed as Morgan, ".txt"]
    exclude_keywords: [not written, never produced, missing, absent, outstanding]
    min_severity: warning
    must_find: true

forbidden:
  # A light run must NOT produce the heavy artifact set (the email is NOT heavy - it stays).
  - id: FP-BRD
    keywords: [wrote the BRD, brd.md, functional spec document, fsd.md, requirements traceability matrix]
  - id: FP-REPORT
    keywords: [delivery-report.md, consolidated delivery report written]

pass:
  require_all_must_find: true
  forbid_all: true
