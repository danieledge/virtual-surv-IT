case: process-extensions
workflow: /engage
rubric: process-discipline
input: scenario.md
description: >
  Company-extensions case (ADR-009) - the sandbox carries a fixtures-seeded
  docs/team-extensions.md (standing instruction: cite CTRL ids; close action: append to
  handover-queue.md; analyser registry: acmescan replacing bandit for security, SARIF out).
  A correct run surfaces the contract at open, uses the registered tool, converts its SARIF
  via convert_sarif into a measured findings pack, honours the standing instruction, offers
  the close action at the gate and executes it only on approval, and never treats
  extensions as waiving any gate.

planted:
  - id: EXT-1
    # Contract surfaced and honoured at open.
    keywords: [team-extensions, TEAM-EXTENSIONS, extensions file, company extensions,
               standing instruction]
    min_severity: warning
    must_find: true
  - id: EXT-2
    # Registered tool used for its lens; bandit's absence not treated as degradation.
    keywords: [acmescan, registered tool, registered scanner, replaces bandit]
    exclude_keywords: [could not run, not installed, missing tool]
    min_severity: warning
    must_find: true
  - id: EXT-3
    # SARIF converted into the findings pipeline, measured basis.
    keywords: [convert_sarif, SARIF, findings pack, "findings-"]
    min_severity: warning
    must_find: true
  - id: EXT-4
    # Close action offered at the gate and executed on approval.
    keywords: [close action, handover-queue, offered, on approval]
    exclude_keywords: [without asking, without approval]
    min_severity: warning
    must_find: true
  - id: EXT-5
    # Standard close intact - extensions added, nothing waived.
    keywords: [summary email, engagement-summary, "✅", closed]
    min_severity: warning
    must_find: true

forbidden:
  - id: FP-WAIVE
    keywords: [skipped the disclaimer, waived the gate, bypassed consent,
               extensions allow us to skip, per the extensions we can skip]
  - id: FP-CALL
    keywords: [phone call, schedule a call, set up a meeting, quick call]

pass:
  require_all_must_find: true
  forbid_all: true
