case: review-sql-injection
workflow: /deep-review
rubric: code-review
input: alert_repository.py
description: >
  A flawed alert data-access layer with one critical SQL injection (desk_name f-string
  interpolation) and one medium SELECT * in a hot polling path, plus a false-positive trap
  (a correctly parameterized query) that must NOT be flagged as injection.

planted:
  - id: SEC-1
    keywords: [sql injection, injection, parameterize, parameterise, f-string, interpolat, bind parameter]
    location: alert_repository.py:12
    min_severity: critical
    must_find: true
  - id: PERF-1
    keywords: ["select *", select star, projection, project columns, hot path, over-fetch]
    location: alert_repository.py:22
    min_severity: medium
    must_find: false

forbidden:
  - id: FP-1
    keywords: [find_alerts_by_trader, parameterized query is unsafe, trader_id injection]
    # `find_alerts_by_trader` is a bare identifier, and _matches() builds its haystack from
    # title + kind + LOCATION (eval_score.py), so without a floor this trap fires on any
    # finding whose location merely names the function - a style note on the duplicated query
    # body tripped it in the 2026-09-03 run while the review had explicitly cited that
    # function's parameterised query as the CORRECT pattern. The trap describes calling a safe
    # query unsafe, which is a warning-or-worse claim; a nitpick that happens to sit in the
    # same function is not the failure being tested.
    min_severity: warning

pass:
  require_all_must_find: true
  forbid_all: true
